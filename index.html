<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TMAP 길안내</title>
<style>
  /* 사운드도곤도곤 일정 보드 → TMAP 연결 페이지. 목적지 정보는 주소의 # 뒤에만 실려 서버로 전송되지 않아요. */
  :root { --bg: #f3f5f7; --card: #ffffff; --fg: #111827; --muted: #6b7280; --blue: #0064ff; --line: #e5e7eb; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --card: #1a1d24; --fg: #eef0f4; --muted: #9aa1ae; --line: #2a2f3a; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 420px; margin: 0 auto; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; display: grid; gap: 14px; }
  .eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  h1 { margin: 0; font-size: 22px; line-height: 1.3; overflow-wrap: anywhere; }
  .addr { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .go { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 17px 14px; border-radius: 14px; background: var(--blue); color: #fff; font-size: 18px; font-weight: 800; text-decoration: none; }
  .go:active { filter: brightness(.92); }
  .tmark { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-weight: 900; font-style: normal; color: #fff;
    background: conic-gradient(from 200deg, #ff4f8b, #9b5cff, #2f7bff, #23d6c0, #ff4f8b); box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); }
  .tip { margin: 0; font-size: 13px; color: var(--muted); }
  .alt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .alt a { display: block; text-align: center; padding: 11px 8px; border-radius: 12px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 700; background: var(--card); }
  .err { color: #d92d3f; }
</style>
</head>
<body>
<main>
  <section class="card" id="card">
    <div class="eyebrow">TMAP 길안내</div>
    <h1 id="name">목적지</h1>
    <p class="addr" id="addr"></p>
    <a class="go" id="go" href="#"><i class="tmark" aria-hidden="true">T</i>TMAP으로 길안내 시작</a>
    <p class="tip">‘TMAP에서 열겠습니까?’가 뜨면 <b>열기</b>를 누르세요. 바로 안 열리면 위 버튼을 누르세요.</p>
  </section>
  <div class="alt">
    <a id="kakao" href="https://map.kakao.com/" target="_blank" rel="noopener">카카오맵으로 열기</a>
    <a href="https://apps.apple.com/kr/app/id431589174" target="_blank" rel="noopener">TMAP 설치하기</a>
  </div>
</main>
<script>
(() => {
  // #n=이름&a=주소&lat=37.38&lng=127.10  (좌표가 있으면 바로 안내, 없으면 주소 검색)
  const q = new URLSearchParams(location.hash.slice(1));
  const name = (q.get("n") || "").trim(), addr = (q.get("a") || "").trim();
  const lat = parseFloat(q.get("lat")), lng = parseFloat(q.get("lng"));
  const hasXY = isFinite(lat) && isFinite(lng) && lat > 32 && lat < 39.5 && lng > 124 && lng < 132;
  const $ = id => document.getElementById(id);
  if (!hasXY && !addr) {
    $("name").textContent = "목적지 정보가 없어요";
    $("addr").innerHTML = '<span class="err">일정 보드의 TMAP 버튼으로 다시 열어 주세요.</span>';
    $("go").remove();
    return;
  }
  const label = name || addr || "목적지";
  const url = hasXY
    ? `tmap://route?rGoName=${encodeURIComponent(label)}&rGoX=${lng}&rGoY=${lat}`
    : `tmap://search?name=${encodeURIComponent(addr)}`;
  document.title = `${label} · TMAP 길안내`;
  $("name").textContent = label;
  $("addr").textContent = addr;
  $("go").href = url;
  $("kakao").href = hasXY ? `https://map.kakao.com/link/to/${encodeURIComponent(label)},${lat},${lng}` : `https://map.kakao.com/?q=${encodeURIComponent(addr)}`;
  // 열리자마자 한 번 TMAP을 불러요. 막히면 버튼이 그대로 남아 있어요.
  setTimeout(() => { location.href = url; }, 80);
})();
</script>
</body>
</html>
